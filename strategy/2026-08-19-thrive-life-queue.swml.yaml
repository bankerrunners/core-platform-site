# Thrive Life inbound queue — live SignalWire resource snapshot.
#
# Number roles:
# - +1 205 351 5118: public inbound line assigned to this resource.
# - +1 205 351 3647: bridge caller ID used when the queue rings the owner.
# - +1 205 351 5158: CORE website outbound identity; not used by this queue.
#
# Status: deployed in SignalWire 2026-08-20; external ring still unverified.
# SignalWire showed the updated resource and Last Update timestamp, but its
# Click-to-Test frame ended at 00:00 and did not ring the private mobile. Do not
# mark the inbound path working until a real call to 5118 reaches the mobile.
#
# No recording, voicemail, transcription, or AI answering is enabled.
#
# 2026-08-20 addition (owner choice "b" — safe after-hours message-taker):
# no AI receptionist. When the seat misses, the flow plays a disclosed message
# and texts the founder the caller's number (${call.from}, from caller ID).
# No recording, no voicemail, no PII beyond the number, and no path for the
# flow to discuss insurance — the un-briefed-AI-on-a-licensed-line risk
# (D4/A29) is designed out rather than mitigated.
#
# Capturing a spoken name was considered and declined: speech-to-text is
# imperfect and risks PII, and voicemail reopens the A25 custody question.
# The number alone is enough to return the call.
#
# Delivery caveat: US A2P SMS from a long code may require 10DLC
# registration. If the notice text does not arrive, the missed call still
# lands in the SignalWire call log, so the caller is not lost — only the
# push notice is.
#
# Re-authored 2026-09-08 against the current single-seat serial hunt. The
# original of this change (PR #108) was written against a three-number roster
# and a flat miss path; both have since changed, so it is applied here to the
# `connect_result != 'connected'` branch that replaced them. The roster itself
# is untouched.
---
version: 1.0.0
sections:
  main:
    - answer: {}
    - play:
        url: "say:Thank you for calling Thrive Life. I'm an automated assistant. Please hold while I connect you with someone who can help."
        say_voice: "amazon.Joanna:neural:en-US"
    - connect:
        from: "+12053513647"
        timeout: 25
        confirm:
          - prompt:
              play:
                - say: "Call for Thrive Life. Press 1 to accept."
                - silence: 2
                - say: "Press 1 to accept this call."
                - silence: 2
                - say: "Last chance. Press 1 to accept."
              say_voice: "amazon.Joanna:neural:en-US"
              max_digits: 1
          - cond:
              - when: "vars.prompt_value != '1'"
                then:
                  - hangup: {}
          - play:
              url: "say:Connecting you now."
              say_voice: "amazon.Joanna:neural:en-US"
        serial:
          - to: "+14095492092"
    - cond:
        - when: "vars.connect_result != 'connected'"
          then:
            - play:
                url: "say:You've reached Thrive Life, and no one is available right now. We already have your number, and a team member will call you back the next business day. Please note this message line does not give insurance quotes or advice. Thank you for calling."
                say_voice: "amazon.Joanna:neural:en-US"
            - send_sms:
                from_number: "+12053513647"
                to_number: "+14095492092"
                body: "Thrive Life - missed call, call back: ${call.from}. Auto-notice (no answer / after hours). No advice given."
            - hangup: {}
